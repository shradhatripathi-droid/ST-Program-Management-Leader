<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Partner ecosystem orchestration diagram">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="16" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#38bdf8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Partner Ecosystem Orchestration  QuickBooks Payments</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">Cross-network platform delivery across fintech partners</text>

  <!-- Hub -->
  <circle cx="480" cy="270" r="78" fill="url(#hubGrad)" filter="url(#shadow)"/>
  <text x="480" y="258" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">QB Payments</text>
  <text x="480" y="278" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="11">Platform Hub</text>
  <text x="480" y="296" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="10">Bill Pay · In Person · APIs</text>

  <!-- Partner nodes -->
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600">
    <rect x="60" y="100" width="110" height="44" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="115" y="127" text-anchor="middle" fill="#f8fafc">Apple</text>
    <line x1="170" y1="122" x2="402" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="790" y="100" width="110" height="44" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="845" y="127" text-anchor="middle" fill="#f8fafc">Chase</text>
    <line x1="790" y1="122" x2="558" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="30" y="250" width="110" height="44" rx="10" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
    <text x="85" y="277" text-anchor="middle" fill="#f8fafc">Visa</text>
    <line x1="140" y1="272" x2="402" y2="272" stroke="#475569" stroke-width="2"/>

    <rect x="820" y="250" width="110" height="44" rx="10" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
    <text x="875" y="277" text-anchor="middle" fill="#f8fafc">Mastercard</text>
    <line x1="820" y1="272" x2="558" y2="272" stroke="#475569" stroke-width="2"/>

    <rect x="60" y="400" width="110" height="44" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <text x="115" y="427" text-anchor="middle" fill="#f8fafc">AMEX</text>
    <line x1="170" y1="400" x2="420" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="790" y="400" width="110" height="44" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <text x="845" y="427" text-anchor="middle" fill="#f8fafc">Discover</text>
    <line x1="790" y1="400" x2="540" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="330" y="430" width="110" height="44" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="385" y="457" text-anchor="middle" fill="#f8fafc">Shift4</text>
    <line x1="420" y1="430" x2="460" y2="348" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="520" y="430" width="110" height="44" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="575" y="457" text-anchor="middle" fill="#f8fafc">AWS</text>
    <line x1="540" y1="430" x2="500" y2="348" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Outcome badges -->
  <rect x="280" y="78" width="400" height="28" rx="14" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.4)"/>
  <text x="480" y="97" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600">Outcomes: $100B+ proposals · 97.3% auth · $50M+ RTP TPV · 2-mo Tap to Pay launch</text>
</svg>
