<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Apple Tap to Pay launch flow">
  <rect width="960" height="340" rx="16" fill="#0f172a"/>
  <text x="480" y="34" text-anchor="middle" fill="#38bdf8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Apple Tap to Pay  2-Month Cross-Functional Launch</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">+30% engagement · $10M annual revenue · Apple + Chase + Card Networks</text>

  <!-- Timeline bar -->
  <rect x="60" y="80" width="840" height="8" rx="4" fill="#1e293b"/>
  <rect x="60" y="80" width="840" height="8" rx="4" fill="url(#timeGrad)"/>
  <defs>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <text x="60" y="72" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="11">Week 1</text>
  <text x="900" y="72" text-anchor="end" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="11">Week 8  Launch</text>

  <!-- Phases -->
  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="60" y="110" width="190" height="90" rx="12" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
    <text x="155" y="138" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">Phase 1 · Align</text>
    <text x="155" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">Apple + Chase partner reqs</text>
    <text x="155" y="174" text-anchor="middle" fill="#cbd5e1" font-size="10">Security &amp; compliance review</text>
    <text x="155" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">Network certification plan</text>

    <rect x="270" y="110" width="190" height="90" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="365" y="138" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">Phase 2 · Build</text>
    <text x="365" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">iPhone contactless integration</text>
    <text x="365" y="174" text-anchor="middle" fill="#cbd5e1" font-size="10">Engineering + Design sprints</text>
    <text x="365" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">Risk &amp; fraud controls</text>

    <rect x="480" y="110" width="190" height="90" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="575" y="138" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">Phase 3 · Certify</text>
    <text x="575" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">Visa / MC / AMEX testing</text>
    <text x="575" y="174" text-anchor="middle" fill="#cbd5e1" font-size="10">End-to-end QA &amp; UAT</text>
    <text x="575" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">Merchant onboarding flows</text>

    <rect x="690" y="110" width="210" height="90" rx="12" fill="rgba(52,211,153,0.12)" stroke="#34d399" stroke-width="1.5"/>
    <text x="795" y="138" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">Phase 4 · Launch</text>
    <text x="795" y="158" text-anchor="middle" fill="#cbd5e1" font-size="10">GA rollout to QB merchants</text>
    <text x="795" y="174" text-anchor="middle" fill="#cbd5e1" font-size="10">+30% engagement lift</text>
    <text x="795" y="190" text-anchor="middle" fill="#6ee7b7" font-size="10">$10M annual revenue target</text>
  </g>

  <!-- Swim lanes -->
  <text x="60" y="240" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600">TEAMS ORCHESTRATED</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="11">
    <rect x="60" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="110" y="270" text-anchor="middle" fill="#e2e8f0">Product</text>
    <rect x="170" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="220" y="270" text-anchor="middle" fill="#e2e8f0">Engineering</text>
    <rect x="280" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="330" y="270" text-anchor="middle" fill="#e2e8f0">Design</text>
    <rect x="390" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="440" y="270" text-anchor="middle" fill="#e2e8f0">Compliance</text>
    <rect x="500" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="550" y="270" text-anchor="middle" fill="#e2e8f0">Risk</text>
    <rect x="610" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="660" y="270" text-anchor="middle" fill="#e2e8f0">Partners</text>
    <rect x="720" y="252" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569"/><text x="770" y="270" text-anchor="middle" fill="#e2e8f0">GTM</text>
  </g>

  <rect x="60" y="300" width="840" height="26" rx="13" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)"/>
  <text x="480" y="318" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="12">In Person Payment Strategy pillar: iPhone contactless acceptance for SMB merchants</text>
</svg>
