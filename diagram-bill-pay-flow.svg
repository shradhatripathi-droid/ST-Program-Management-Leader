<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Bill Pay platform flow">
  <rect width="960" height="360" rx="16" fill="#0f172a"/>
  <text x="480" y="34" text-anchor="middle" fill="#38bdf8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Bill Pay Platform  End-to-End Flow</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">$80M ACH opportunity · 6M invoices · Recurring &amp; Real-Time Payments</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <!-- Row 1: User journey -->
    <rect x="40" y="85" width="130" height="70" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="115" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">SMB User</text>
    <text x="105" y="135" text-anchor="middle" fill="#94a3b8" font-size="10">QuickBooks</text>

    <line x1="170" y1="120" x2="200" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>

    <rect x="205" y="85" width="130" height="70" rx="12" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
    <text x="270" y="115" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Invoice / Bill</text>
    <text x="270" y="135" text-anchor="middle" fill="#94a3b8" font-size="10">6M invoices enabled</text>

    <line x1="335" y1="120" x2="365" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="370" y="85" width="150" height="70" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <text x="445" y="112" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Bill Pay Engine</text>
    <text x="445" y="130" text-anchor="middle" fill="#cbd5e1" font-size="10">ACH · RTP · Recurring</text>
    <text x="445" y="146" text-anchor="middle" fill="#94a3b8" font-size="10">Pay For You (Sunlight)</text>

    <line x1="520" y1="120" x2="550" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="555" y="85" width="150" height="70" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="630" y="112" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Payment Rails</text>
    <text x="630" y="130" text-anchor="middle" fill="#cbd5e1" font-size="10">Tokenization · Networks</text>
    <text x="630" y="146" text-anchor="middle" fill="#94a3b8" font-size="10">97.3% auth rate</text>

    <line x1="705" y1="120" x2="735" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="740" y="85" width="180" height="70" rx="12" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="112" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">Business Outcomes</text>
    <text x="830" y="130" text-anchor="middle" fill="#cbd5e1" font-size="10">$80M ACH · $15M Sunlight</text>
    <text x="830" y="146" text-anchor="middle" fill="#cbd5e1" font-size="10">$50M+ RTP TPV</text>

    <!-- Row 2: Cross-functional layer -->
    <text x="40" y="200" fill="#64748b" font-size="11" font-weight="600">CROSS-FUNCTIONAL LAYERS</text>
    <rect x="40" y="212" width="880" height="56" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="130" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11">Engineering</text>
    <text x="260" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11">Design</text>
    <text x="390" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11">Compliance</text>
    <text x="520" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11">Risk &amp; Fraud</text>
    <text x="650" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11">Finance</text>
    <text x="780" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11">Partner Networks</text>
    <line x1="195" y1="212" x2="195" y2="268" stroke="#334155" stroke-width="1"/>
    <line x1="325" y1="212" x2="325" y2="268" stroke="#334155" stroke-width="1"/>
    <line x1="455" y1="212" x2="455" y2="268" stroke="#334155" stroke-width="1"/>
    <line x1="585" y1="212" x2="585" y2="268" stroke="#334155" stroke-width="1"/>
    <line x1="715" y1="212" x2="715" y2="268" stroke="#334155" stroke-width="1"/>

    <!-- Metrics bar -->
    <rect x="40" y="295" width="880" height="44" rx="12" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)"/>
    <text x="160" y="322" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">RTP: 100% rollout</text>
    <text x="360" y="322" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">ACH: 80% auto-match</text>
    <text x="560" y="322" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">Bill Pay CC: $6M target</text>
    <text x="760" y="322" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">+20% approval lift</text>
