<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Program delivery framework">
  <rect width="960" height="280" rx="16" fill="#0f172a"/>
  <text x="480" y="34" text-anchor="middle" fill="#38bdf8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Program Delivery Framework</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">How I take complex platform programs from strategy to measurable outcomes</text>

  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Steps -->
  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="40" y="100" width="150" height="100" rx="14" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="115" y="132" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">1. Discover</text>
    <text x="115" y="154" text-anchor="middle" fill="#cbd5e1" font-size="11">Market research</text>
    <text x="115" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11">Partner reqs</text>
    <text x="115" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">Risk &amp; compliance</text>

    <polygon points="200,150 220,150 220,140 240,150 220,160 220,150" fill="#64748b"/>

    <rect x="250" y="100" width="150" height="100" rx="14" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
    <text x="325" y="132" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">2. Align</text>
    <text x="325" y="154" text-anchor="middle" fill="#cbd5e1" font-size="11">Roadmap &amp; OKRs</text>
    <text x="325" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11">Leadership buy-in</text>
    <text x="325" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">Cross-org planning</text>

    <polygon points="410,150 430,150 430,140 450,150 430,160 430,150" fill="#64748b"/>

    <rect x="460" y="100" width="150" height="100" rx="14" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <text x="535" y="132" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">3. Execute</text>
    <text x="535" y="154" text-anchor="middle" fill="#cbd5e1" font-size="11">Agile delivery</text>
    <text x="535" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11">Partner orchestration</text>
    <text x="535" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">150+ person programs</text>

    <polygon points="620,150 640,150 640,140 660,150 640,160 640,150" fill="#64748b"/>

    <rect x="670" y="100" width="150" height="100" rx="14" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="745" y="132" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">4. Measure</text>
    <text x="745" y="154" text-anchor="middle" fill="#cbd5e1" font-size="11">TPV · Auth rates</text>
    <text x="745" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11">Revenue &amp; savings</text>
    <text x="745" y="186" text-anchor="middle" fill="#94a3b8" font-size="10">NPS &amp; engagement</text>

    <polygon points="830,150 850,150 850,140 870,150 850,160 850,150" fill="#64748b"/>

    <rect x="880" y="115" width="60" height="70" rx="14" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="1.5"/>
    <text x="910" y="148" text-anchor="middle" fill="#6ee7b7" font-size="22" font-weight="700">$</text>
    <text x="910" y="168" text-anchor="middle" fill="#6ee7b7" font-size="10">Impact</text>
  </g>

  <text x="480" y="250" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="12">Applied across Bill Pay, Tokenization, Apple Tap to Pay, RTP, API Platform, and AI/ML programs</text>
</svg>
